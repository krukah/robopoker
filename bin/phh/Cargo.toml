[package]
name         = "phh-cli"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Evaluate the blueprint against published poker hand histories"
license      = "MIT"

[[bin]]
name = "phh-cli"
path = "src/main.rs"

[dependencies]
phh        = { workspace = true }
deuce      = { workspace = true }
kicker     = { workspace = true }
pokerkit   = { workspace = true }
nlhe       = { workspace = true }
daybook    = { path = "../../crates/daybook" }
parlor     = { path = "../../crates/parlor", features = ["server"] }
clap       = { workspace = true, features = ["env", "derive"] }
reqwest    = { workspace = true }
futures    = { workspace = true }
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow     = "1"

[lints]
workspace = true
