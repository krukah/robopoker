[package]
name         = "litmus-cli"
publish      = false
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "CLI wrapper around litmus. Loads scenarios, runs the catalog, writes a markdown report."
license      = "MIT"

[[bin]]
name = "litmus-cli"
path = "src/main.rs"

[[bin]]
name = "litmus-audit"
path = "src/audit.rs"

[dependencies]
litmus   = { path = "../../crates/litmus" }
portal   = { path = "../../crates/portal" }
daybook  = { path = "../../crates/daybook" }
pokerkit = { path = "../../crates/pokerkit", features = ["server", "cli"] }
kicker   = { path = "../../crates/kicker" }

tokio              = { version = "1", features = ["rt-multi-thread", "macros", "rt"] }
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
