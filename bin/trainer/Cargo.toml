[package]
name         = "trainer"
publish      = false
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "MCCFR training pipeline binary"
license      = "MIT"

[[bin]]
name = "trainer"
path = "src/main.rs"

[features]
default = []
# 6-max build: flips pokerkit::N to 6 across the whole trainer graph (cargo
# unifies the pokerkit compile). Run with `--features sixmax` to launch a
# 6-way trainer alongside an untouched 2-max run.
sixmax = ["pokerkit/sixmax"]

[dependencies]
pokerkit           = { path = "../../crates/pokerkit", features = ["server", "cli"] }
forge              = { path = "../../crates/forge" }
clap               = { workspace = true }
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mimalloc           = { workspace = true }

[lints]
workspace = true
