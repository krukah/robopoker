[package]
name         = "scoreboard"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Cross-fingerprint training scoreboard"
license      = "MIT"

[[bin]]
name = "scoreboard"
path = "src/main.rs"

[dependencies]
daybook    = { workspace = true }
vitals     = { workspace = true }
clap       = { workspace = true }
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow     = "1"

[lints]
workspace = true
