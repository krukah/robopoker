[package]
name         = "kuhn"
publish      = false
version      = "3.0.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Kuhn poker solver for MCCFR framework validation"
license      = "MIT"
repository   = "https://github.com/krukah/robopoker"
keywords     = ["kuhn", "cfr", "game-theory", "poker", "solver"]
categories   = ["algorithms", "mathematics", "game-development"]

[features]
default = ["server"]
server  = ["mccfr/server"]

[dependencies]
pokerkit = { workspace = true }
mccfr    = { version = "3.0", path = "../mccfr", default-features = false }
subgame  = { workspace = true }
monge    = { workspace = true }
paste    = "1.0"
rand     = { workspace = true }

[lints]
workspace = true
