# Deliberately outside the workspace (see `exclude` in the root Cargo.toml).
# tree-sitter builds C, and a workspace member would pay that cost in every
# compile-matrix job. Only the House Lint job builds this crate.
[package]
name         = "lints"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Diff-scoped house-style linter for robopoker"
license      = "MIT"
publish      = false

[lib]
name = "lints"
path = "src/lib.rs"

[[bin]]
name = "lints"
path = "src/main.rs"

[dependencies]
anyhow                 = "1"
clap                   = { version = "4", features = ["derive"] }
regex                  = "1"
serde_json             = "1"
tree-sitter            = "0.25"
tree-sitter-rust       = "0.24"
tree-sitter-typescript = "0.23"

# The crate sits outside the workspace, so it cannot inherit
# `[workspace.lints]`. These mirror the house allows in the root `Cargo.toml`
# that this crate actually trips; the rest of pedantic is left on.
[lints.clippy]
pedantic                 = { level = "warn", priority = -1 }
wildcard_imports         = "allow"                           # house style: prefer glob imports
must_use_candidate       = "allow"
doc_markdown             = "allow"
match_same_arms          = "allow"
similar_names            = "allow"
struct_excessive_bools   = "allow"
cast_precision_loss      = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
assert_is_empty          = "allow"
