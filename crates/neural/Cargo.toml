[package]
name         = "neural"
version      = "1.2.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Deep CFR: function approximators in place of MCCFR's regret and strategy tables"
license      = "MIT"
repository   = "https://github.com/krukah/robopoker"
keywords     = ["deep-cfr", "cfr", "game-theory", "neural-network", "solver"]
categories   = ["algorithms", "mathematics", "game-development"]

[features]
default = ["server"]
server  = ["mccfr/server", "rayon"]

[dependencies]
pokerkit    = { workspace = true }
mccfr       = { version = "1.2", path = "../mccfr", default-features = false }
monge       = { workspace = true }
rand        = { workspace = true }
rustc-hash  = "2.1"
rayon       = { optional = true, version = "1.10" }
candle-core = "0.11"
candle-nn   = "0.11"

[dev-dependencies]
kuhn     = { workspace = true }
roshambo = { workspace = true }

[lints]
workspace = true
