[package]
name         = "kicker"
version      = "1.2.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Poker game engine with state management, action handling, and settlement"
license      = "MIT"
repository   = "https://github.com/krukah/robopoker"
keywords     = ["poker", "game-engine", "nlhe"]
categories   = ["game-development"]

[features]
default = []
# SQL codecs (ToSql/FromSql) directly on domain types (Path, Field, Edge),
# so DB layers pass domain values instead of hand-converted primitives.
sql = ["tokio-postgres", "deuce/sql"]

[dependencies]
tracing        = { workspace = true }
pokerkit       = { workspace = true }
deuce          = { workspace = true }
rand           = { workspace = true }
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
uuid           = { version = "1", features = ["serde"] }
anyhow         = "1.0"
petgraph       = { workspace = true }
tokio-postgres = { version = "0.7", optional = true }

[lints]
workspace = true
