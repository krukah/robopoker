[package]
name         = "deuce"
version      = "1.2.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "Card representation, hand evaluation, and strategic abstraction primitives"
license      = "MIT"
repository   = "https://github.com/krukah/robopoker"
keywords     = ["poker", "cards", "hand-evaluation", "nlhe"]
categories   = ["game-development", "algorithms"]

[features]
default   = []
shortdeck = []
# SQL codecs (ToSql/FromSql) directly on domain types (Isomorphism).
sql = ["tokio-postgres"]

[dependencies]
pokerkit       = { workspace = true }
tokio-postgres = { version = "0.7", optional = true }
rand           = { workspace = true }
serde          = { version = "1.0", features = ["derive"] }
anyhow         = "1.0"

[lints]
workspace = true
