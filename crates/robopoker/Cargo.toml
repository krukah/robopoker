[package]
name         = "robopoker"
version      = "2.0.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "GTO poker toolkit: MCCFR solver, hand evaluation, strategic abstraction, and training pipeline"
license      = "MIT"
repository   = "https://github.com/krukah/robopoker"
keywords     = ["poker", "mccfr", "gto", "solver", "holdem"]
categories   = ["game-development", "algorithms", "mathematics"]

[dependencies]
pokerkit = { version = "2.0", path = "../pokerkit" }
monge    = { version = "2.0", path = "../monge" }
deuce    = { version = "2.0", path = "../deuce" }
mccfr    = { version = "2.0", path = "../mccfr" }
subgame  = { version = "2.0", path = "../subgame" }
kicker   = { version = "2.0", path = "../kicker" }
nlhe     = { version = "2.0", path = "../nlhe" }
daybook  = { version = "2.0", path = "../daybook" }

[lints]
workspace = true
