[package]
name         = "robopoker"
version      = "1.0.0"
edition      = "2024"
rust-version = "1.90"
authors      = ["Kelechi Ukah <ukahkelechi@gmail.com>"]
description  = "GTO poker toolkit: MCCFR solver, hand evaluation, strategic abstraction, and training pipeline"
license      = "MIT"
repository   = "https://github.com/krukah/robopoker"
keywords     = ["poker", "mccfr", "gto", "solver", "holdem"]
categories   = ["game-development", "algorithms", "mathematics"]

[dependencies]
pokerkit = { path = "../pokerkit" }
monge    = { path = "../monge" }
deuce    = { path = "../deuce" }
mccfr    = { path = "../mccfr" }
subgame  = { path = "../subgame" }
kicker   = { path = "../kicker" }
lloyd    = { path = "../lloyd" }
nlhe     = { path = "../nlhe" }
roshambo = { path = "../roshambo" }
leduc    = { path = "../leduc" }
daybook  = { path = "../daybook" }
bouncer  = { path = "../bouncer" }
parlor   = { path = "../parlor" }
portal   = { path = "../portal" }
forge    = { path = "../forge" }

[lints]
workspace = true
